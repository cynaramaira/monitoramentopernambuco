name: Monitor Politica PE
on:
  schedule:
    # Roda a cada 30 minutos (nos minutos 12 e 42 de cada hora)
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-pe
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mantém o histórico dos picos das últimas rodadas via cache nativo
      - uses: actions/cache@v4
        with:
          path: dados/historico/hist_*.json
          key: historico-pe-${{ github.run_id }}
          restore-keys: historico-pe-

      - name: Executar Coletor
        run: python scripts/monitor_pe.py

      - name: Commit e Push dos Dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados nesta rodada"
            exit 0
          fi
          git commit -m "Atualização dos dados PE [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1